<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/main-window.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    </style>

    <script src="js/mainWindow-FrontEnd.js" defer></script>

    <script src="js/globalMethods-FrontEnd.js" defer></script>

    <script src="js/taskList-FrontEnd.js" defer></script>
    <script src="js/taskListFunctions-FrontEnd.js" defer></script>

    <script src="js/noteList-FrontEnd.js" defer></script>
    <script src="js/noteListFunctions-FrontEnd.js" defer></script>

    <script src="js/task-FrontEnd.js" defer></script>
    <script src="js/taskFunctions-FrontEnd.js" defer></script>

    <script src="js/note-FrontEnd.js" defer></script>
    <script src="js/noteFunctions-FrontEnd.js" defer></script>

    <script src="js/viewsSelection-FrontEnd.js" defer></script>
    <script src="js/viewsModelAndFunctions-FrontEnd.js" defer></script>

    <script src="js/logout-FrontEnd.js" defer></script>
</head>

<body>
    <div id="document-container">

        <header id="header">
            <i class="fa-solid fa-bars list-icon"></i>
            <h1 id="header-title"></h1>
            <p id="header-type"></p>
        </header>

        <main id="main">
        </main>

        <!-- sidebar -->
        <div id="sidebar-div" class="sidebar modal"></div>

        <dialog id="sidebar-dialog" class="sidebar modal">
            <aside class="sidebar-aside">
                <header class="sidebar-header">
                    <h2 class="user-name">User Bauser</h2>
                    <i class="fa-solid fa-bars list-close-icon"></i>
                </header>

                <section>
                    <h3>Views</h3>
                    <ul class="views">
                    </ul>
                </section>

                <section>
                    <div class="section-title">
                        <h3>Lists</h3>
                        <i class="fa-solid fa-plus create-task-list-icon" onclick="openCreateTaskListDialog(event)"></i>
                    </div>
                    <ul class="tasks">
                    </ul>
                </section>

                <section>
                    <div class="section-title">
                        <h3>Notes</h3>
                        <i class="fa-solid fa-plus create-note-list-icon" onclick="openCreateNoteListDialog(event)"></i>
                    </div>
                    <ul class="notes">
                    </ul>
                </section>

                <footer class="sidebar-footer">
                    <!--  -->
                    <p class="logout-word" onclick="openLogoutDialog(event)">Logout</p>
                    <a href="#">About</a>
                    <a href="#">Contact Us</a>
                </footer>
            </aside>
        </dialog>

        <!-- right-side -->
        <div id="right-side-div" class="right-side modal" data-type="" data-id=""></div>

        <dialog id="right-side-dialog" class="right-side modal">

            <aside class="right-side-aside">
                <header class="right-side-header">
                    <i class="fa-solid fa-angles-right right-side-close-icon"></i>
                    <h2 class="right-side-title"></h2>
                </header>
            </aside>
        </dialog>



        <!-- ##### Action Dialog -->
        <dialog id="action-dialog" class="modal" data-id="" data-action="">
        </dialog>

    </div>
</body>

</html>
